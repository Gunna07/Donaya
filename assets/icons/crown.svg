<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A5"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF75A0"/>
      <stop offset="100%" stop-color="#FF2A85"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Crown Base & Spikes -->
  <path d="M15 72 L22 35 L38 52 L50 22 L62 52 L78 35 L85 72 Z" fill="url(#goldGrad)" filter="url(#glow)" stroke="#FFF0A5" stroke-width="1.5"/>
  <rect x="15" y="72" width="70" height="9" rx="4.5" fill="url(#goldGrad)" stroke="#FFF0A5" stroke-width="1"/>
  <!-- Jewels on Spikes -->
  <circle cx="22" cy="33" r="4.5" fill="url(#pinkGrad)"/>
  <circle cx="50" cy="20" r="6" fill="url(#pinkGrad)"/>
  <circle cx="78" cy="33" r="4.5" fill="url(#pinkGrad)"/>
  <!-- Center Diamond Emblem -->
  <polygon points="50,44 58,54 50,64 42,54" fill="url(#pinkGrad)" stroke="#FFF0A5" stroke-width="1.2"/>
  <!-- Base gems -->
  <circle cx="30" cy="76.5" r="2.5" fill="#FFF"/>
  <circle cx="50" cy="76.5" r="3" fill="url(#pinkGrad)"/>
  <circle cx="70" cy="76.5" r="2.5" fill="#FFF"/>
</svg>
